# my global config
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.

scrape_configs:
  - job_name: "node-server"
    static_configs:
      - targets: ["node-server:8000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]

